name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify PDF dataset and run tests
        run: npm run verify

      - name: Build static site (_site)
        run: node scripts/build-pages.js

      - name: Publish _site to gh-pages branch
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAGE_DIR=$(mktemp -d)
          cp -R _site/. "$STAGE_DIR"/
          cd "$STAGE_DIR"
          git init -b gh-pages
          git add -A
          git commit -m "Deploy GitHub Pages from ${{ github.sha }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
